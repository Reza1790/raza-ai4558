name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q "$(ls *.zip | head -n 1)"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: RazaAIAssistant
      - uses: actions/upload-artifact@v4
        with:
          name: RazaAI-APK
          path: RazaAIAssistant/app/build/outputs/apk/debug/app-debug.apk
